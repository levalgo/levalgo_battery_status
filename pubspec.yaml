name: levalgo_battery_status
description: >-
  Read the battery level, the charging state and state changes on iOS. Swift
  implementation over MethodChannel and EventChannel.
version: 0.3.0
homepage: https://github.com/levalgo/levalgo_battery_status
repository: https://github.com/levalgo/levalgo_battery_status
issue_tracker: https://github.com/levalgo/levalgo_battery_status/issues

environment:
  sdk: ^3.8.1
  # Raised from 3.3.0 for Swift Package Manager: the package's FlutterFramework
  # dependency is generated by the Flutter tool and only exists from 3.41.
  # This is the breaking part of 0.3.0.
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      # iOS only. This package exists for its iOS native layer, and declaring
      # Android without implementing it would ship a broken platform.
      ios:
        pluginClass: LevalgoBatteryStatusPlugin
